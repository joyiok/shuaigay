name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发（改 workflow 时不用空提交验证）
  workflow_dispatch:

# 同分支重复推送时取消旧的运行，省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # docker 构建缓存 type=gha 需要读写 Actions 缓存
  actions: write
  # 推送 app 镜像到 GHCR
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_URL: http://localhost:3100
  E2E_BASE_URL: http://localhost:3100
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
  TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
  TURNSTILE_HOSTNAMES: "example.com"
  TURNSTILE_TEST_MODE: "1"
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: "ReleaseAdmin123!"

jobs:
  # 类型检查 / 单测 / 构建 / e2e 合并成一个 job：
  # 共用一次 npm ci + prisma 初始化 + next build，避免 e2e job 再重复一遍
  checks:
    name: checks · typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forum
          POSTGRES_PASSWORD: forum
          POSTGRES_DB: forum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://forum:forum@localhost:5432/forum_test?schema=public
      REDIS_URL: redis://localhost:6379
      UPLOAD_DIR: /tmp/forum-uploads
      STORAGE_DRIVER: local
      # e2e / 集成测试连续注册，放宽限流避免同 IP 误判
      # bcryptjs 纯 JS 阻塞事件循环，测试用低成本省 runner
      BCRYPT_ROUNDS: "4"
      RATE_LIMIT_REGISTER: "100"
      RATE_LIMIT_LOGIN: "100"
      RATE_LIMIT_THREAD: "100"
      RATE_LIMIT_REPLY: "100"
      RATE_LIMIT_EDIT: "100"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate (显式，确保 @prisma/client 与 schema 一致)
        run: npx prisma generate

      - name: Migrate deploy
        run: npx prisma migrate deploy

      - name: Seed (默认板块 · 敏感词等)
        run: npx prisma db seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production config checks
        run: npm run test:release

      - name: Build (standalone · 60s 缓存 + headers 已含)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Start standalone server (:3100)
        # E2E_BASE_URL 已设置时 playwright 不会自动起 webServer，这里手动后台起。
        # public/ 也要拷进 standalone 目录，否则 /art/*.webp 等静态资源 404（页面图片裂开）。
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          (cd .next/standalone && PORT=3100 nohup node server.js > /tmp/standalone.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3100/api/health

      - name: Run e2e
        run: npx playwright test

      - name: Upload Playwright report (仅失败时)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            blob-report
          retention-days: 7

      - name: Upload build trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: next-build-trace
          path: |
            .next
            !.next/cache
          retention-days: 7

  docker:
    name: docker · build & push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 上构建并推送（sha 定版 + latest）；PR 只验证能否构建
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Validate compose config
        run: docker compose config >/dev/null && echo "compose.yml OK"

      # 服务器按公开地址拉镜像（镜像里无任何密钥，仓库本身也是公开的）
      - name: Make package public
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/shuaigay" \
            -d '{"visibility":"public"}' | head -c 300 || true

  deploy:
    name: deploy · production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Backup and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_REPO: ${{ github.repository }}
        run: |
          ssh -o BatchMode=yes root@"$DEPLOY_HOST" 'bash -s' -- "${{ github.sha }}" "$APP_REPO" <<'REMOTE'
          set -eu
          expected_sha=$1
          app_repo=$2
          cd /opt/shuaigay
          test -z "$(git status --porcelain)"
          docker compose exec -T backup sh /scripts/pre-dump.sh </dev/null
          git pull --ff-only
          test "$(git rev-parse HEAD)" = "$expected_sha"
          # 拉 CI 预构建的镜像（按 commit 定版），只重建 app 容器：不再在服务器上编译，
          # 停机从 1~2 分钟降到秒级；回滚只需把 APP_IMAGE 指回旧 sha
          export APP_IMAGE="ghcr.io/${app_repo}:sha-${expected_sha}"
          docker compose pull app
          docker compose up -d --wait --wait-timeout 120 app
          docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          REMOTE

      - name: Verify public site
        run: curl --fail --silent --show-error https://shuai.gay/api/health
