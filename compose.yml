services:
  postgres:
    image: postgres:17-alpine
    # 宿主机 5432 可能被系统自带 PostgreSQL 占用,映射到 5433
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-forum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forum} -d ${POSTGRES_DB:-forum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "900", "1"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    # SITE_URL 用于生成邮件链接与 sitemap,必须与 Caddy 的 DOMAIN 保持一致
    # SMTP_URL 留空则邮件仅打印到容器日志,配置后真实发送(见 src/lib/email.ts)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forum}:${POSTGRES_PASSWORD:-forum_dev_password}@postgres:5432/${POSTGRES_DB:-forum}?schema=public
      REDIS_URL: redis://redis:6379
      SITE_URL: ${SITE_URL:-https://${DOMAIN:-localhost}}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STORAGE_DRIVER: local
      UPLOAD_DIR: /srv/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      TURNSTILE_TEST_MODE: ${TURNSTILE_TEST_MODE:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-20}
      RATE_LIMIT_THREAD: ${RATE_LIMIT_THREAD:-5}
      RATE_LIMIT_REPLY: ${RATE_LIMIT_REPLY:-10}
      RATE_LIMIT_EDIT: ${RATE_LIMIT_EDIT:-10}
      RATE_LIMIT_RATE: ${RATE_LIMIT_RATE:-40}
      AI_ADMIN_API_KEY: ${AI_ADMIN_API_KEY:-}
      AI_ADMIN_USER_ID: ${AI_ADMIN_USER_ID:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_AUTOMATION_ENABLED: ${AI_AUTOMATION_ENABLED:-0}
      AI_AUTO_CONFIDENCE: ${AI_AUTO_CONFIDENCE:-0.9}
    volumes:
      - ./uploads:/srv/uploads
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 依赖 /api/health 存活探针;失败 3 次后 Docker 标记为 unhealthy
      # node:bookworm-slim 镜像不带 wget/curl,用 node 内置 fetch 探活
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
      CADDY_DOMAINS: ${CADDY_DOMAINS:-${DOMAIN:-:80}}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: ./docker/backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-forum}
      PGPASSWORD: ${POSTGRES_PASSWORD:-forum_dev_password}
      PGDATABASE: ${POSTGRES_DB:-forum}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-dev-only-restic-pass}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AI_AUTOMATION_ENABLED: ${AI_AUTOMATION_ENABLED:-0}
      AI_ADMIN_API_KEY: ${AI_ADMIN_API_KEY:-}
      AI_AUTOMATION_URL: ${AI_AUTOMATION_URL:-http://app:3000/api/ai/automation/run}
    volumes:
      - ./uploads:/srv/uploads:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
